name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BurnMachine.sln

      - name: Test
        run: dotnet test BurnMachine.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/BurnMachine/BurnMachine.csproj --configuration Release --no-restore --output out

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push out/*.nupkg \
            --source https://nuget.pkg.github.com/donkilove/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
